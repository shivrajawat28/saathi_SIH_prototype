services:
  # SAATHI FastAPI Backend Web Service
  - type: web
    name: saathi-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saathi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"

  # SAATHI Frontend React Static Site
  - type: web
    name: saathi-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: saathi-backend
          property: host

databases:
  # SAATHI PostgreSQL Managed Database
  - name: saathi-db
    databaseName: saathidb
    user: saathi
    plan: free
